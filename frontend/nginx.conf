server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location ~ /\. {
    return 404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
