services:
  # Banco de dados MySQL do BookNest
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - rede-interna

  # 2. Backend Node.js
  backend:
    build: ./backend
    container_name: backend_node
    restart: always

    ports:
      - "3001:3001"
    
    environment:
      PORT: 3001
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    depends_on:
      - db

    networks:
      - rede-interna
      - rede-externa

networks:
  rede-interna:
    driver: bridge
  rede-externa:
    driver: bridge

volumes:
  db_data: