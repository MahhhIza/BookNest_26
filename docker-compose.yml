services:
  db:
    image: mysql:8.4
    container_name: booknest_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rede-interna

  backend:
    build: ./backend
    container_name: booknest_backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-interna

  frontend:
    build: ./frontend
    container_name: booknest_frontend
    restart: unless-stopped
    networks:
      - rede-interna

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: booknest_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rede-publica
      - rede-interna

networks:
  rede-publica:
    driver: bridge
  rede-interna:
    driver: bridge
    internal: true

volumes:
  db_data:
